[project]
name = "guilddraw"
# Version lives in framedraft/__init__.py; nothing here builds a wheel.
dynamic = ["version"]
# PEP 604 unions and 3.12 syntax are used throughout -- see the gate in main.py.
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# F = pyflakes (real bugs: undefined/unused names), E9 = syntax errors,
# B = bugbear (likely bugs). Style rules (E1xx/E2xx) are deliberately off:
# the codebase uses aligned assignments.
select = ["F", "E9", "B"]
