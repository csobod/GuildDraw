# Builds the macOS artifacts on GitHub's free macOS runners — no local Mac
# needed. Trigger it manually (Actions tab > "macOS build" > Run workflow),
# then download the artifacts and attach them to the GitHub release.
#
# One artifact per architecture (PyInstaller does not cross-compile):
#   - macos-14 runner        -> arm64  (Apple Silicon)
#   - macos-15-intel runner  -> x86_64 (Intel; best-effort — GitHub is
#     winding Intel runners down, so this leg may need a new label or can
#     be dropped when it stops working)
name: macOS build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            required: true
          - runner: macos-15-intel
            arch: x86_64
            required: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 40             # a healthy run is ~15 min; never burn hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release notes promise macOS 13, Qt 6.11's floor. numpy (which
      # shapely and ezdxf bring in) publishes a macOS 14 build on Accelerate
      # beside one for older macOS on OpenBLAS, and pip on a runner at 14 or
      # later takes the newer; the 2.0 bundles first came out needing macOS 14
      # that way. The older wheel goes in first, so the requirements find
      # numpy satisfied.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip download --only-binary=:all: --no-deps --platform macosx_13_0_${{ matrix.arch }} numpy -d wheels-macos13
          .venv/bin/pip install wheels-macos13/*.whl
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/pip install pytest-timeout   # CI-only: per-test hang guard

      # A wheel whose every macOS tag is newer than 13 cannot be in the bundle.
      - name: Every wheel installs on macOS 13
        run: |
          .venv/bin/python - <<'EOF'
          import importlib.metadata as md, re, sys
          late = []
          for dist in md.distributions():
              tags = [ln.split(":", 1)[1].strip() for ln in (dist.read_text("WHEEL") or "").splitlines()
                      if ln.startswith("Tag:")]
              macs = [int(m.group(1)) for t in tags if (m := re.search(r"macosx_(\d+)_", t))]
              if macs and min(macs) > 13:
                  late.append(f"{dist.metadata['Name']} {dist.version}: {', '.join(tags)}")
          print("\n".join(late) or "every wheel installs on macOS 13")
          sys.exit(1 if late else 0)
          EOF

      # Full suite as the gate. The thread-based timeout is deliberate: the
      # one macOS hang found so far was a modal QMessageBox inside a native
      # event loop, which the default signal method cannot interrupt — the
      # thread method turns any such hang into a stack dump naming the test.
      - name: Test gate
        timeout-minutes: 20
        run: .venv/bin/python -m pytest tests -v --timeout=120 --timeout-method=thread

      - name: Build (.app + zip + dmg)
        env:
          GUILDDRAW_SKIP_SMOKE: "1"   # no window session for a launch check
          GUILDDRAW_SKIP_TESTS: "1"   # the Test gate step above already ran
        run: bash scripts/build_release_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuildDraw-macos-${{ matrix.arch }}
          path: |
            dist/GuildDraw-*-macos-*.zip
            dist/GuildDraw-*-macos-*.dmg
          if-no-files-found: error
